name: Testing
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .tool-versions
          bundler-cache: true
      - name: Run tests
        run: bundle exec ruby test/test.rb
